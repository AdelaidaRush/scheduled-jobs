name: people

# Сбор людей. Два сборщика: основная гипотеза (Азия и Залив) и вторая (СНГ, Кавказ, Монголия).
#
# 🔴 ПЕРЕЛОЖЕНО 31.08.2026, три причины, все замеренные.
#
# 1. Квота Google сбрасывается в полночь по тихоокеанскому времени, летом это 07:00 UTC.
#    Прежний заход в 06:10 приходил ДО сброса, заставал все семь ключей выжатыми со вчера
#    и не мог собрать ничего. Все заходы теперь после 07:30.
# 2. Расписание GitHub рвётся: за 29 и 30 августа из восьми назначенных прогонов состоялось
#    семь, и все с опозданием от сорока минут до шести часов. Поэтому попыток теперь больше,
#    чем нужно, а от перерасхода защищает не расписание, а потолок трат внутри захода.
# 3. Потолок BS_MAX_CALLS. Квота контура 700 обращений в сутки на ВСЕ заходы вместе.
#    85 × 6 основных + 85 × 2 по СНГ = 680, то есть даже при всех сработавших попытках
#    в квоту укладываемся. Заход, пришедший на пустую квоту, теперь не падает: он перебирает
#    ключи, не находит живого и выходит.
on:
  schedule:
    - cron: "40 7,9,11,13,15,17 * * *"   # основная гипотеза, шесть попыток после сброса квоты
    - cron: "40 19,21 * * *"             # вторая гипотеза, СНГ
  workflow_dispatch:
    inputs:
      hypothesis:
        description: "main или cis"
        required: false
        default: "main"
      queries:
        description: "сколько поисковых запросов за заход"
        required: false
        default: "12"
      max_calls:
        description: "потолок обращений к поиску за заход"
        required: false
        default: "85"

permissions:
  contents: write

concurrency:
  group: queue-b
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VAULT_PASS: ${{ secrets.VAULT_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet gspread google-auth

      - name: run
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          GOOGLE_CSE_IDS: ${{ secrets.GOOGLE_CSE_IDS }}
          BS_SHEET_ID: ${{ secrets.BS_SHEET_ID }}
          BS_MAX_CALLS: ${{ github.event.inputs.max_calls || '85' }}
        run: |
          H=$(date -u +%H)
          WHICH="${{ github.event.inputs.hypothesis }}"
          if [ -z "$WHICH" ]; then
            # СНГ идёт в вечерние часы, всё остальное время работает основная гипотеза
            case "$H" in 19|20|21|22) WHICH=cis ;; *) WHICH=main ;; esac
          fi
          N="${{ github.event.inputs.queries }}"; N="${N:-12}"
          echo "гипотеза: $WHICH · запросов: $N · потолок обращений: $BS_MAX_CALLS"
          if [ "$WHICH" = "cis" ]; then ./run.sh main_people_cis.py "$N"; else ./run.sh main_people.py "$N"; fi

      - name: save state
        run: |
          if ! git diff --quiet; then
            git config user.email "bot@local"; git config user.name "bot"
            git add -A && git commit -m "state $(date -u +%FT%RZ)" && git push
          fi
