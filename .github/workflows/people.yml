name: people

# Сбор людей: основная гипотеза (Азия и Залив) и вторая (СНГ, Кавказ, Монголия).
#
# 🔴 ПЕРЕЛОЖЕНО 01.09.2026 по решению Дениса: не «в такой-то час», а «прошло столько-то
# часов с прошлого прогона». Причина замерена: крон GitHub рвётся и опаздывает, а у
# рассылки расписание «каждые десять минут» задушено до одного прогона в сутки. При
# жёстких часах пропущенный час теряется навсегда; здесь следующая попытка видит
# просрочку и добирает.
#
# Попытка приходит каждый час с 07:25 до 23:25 UTC. Раньше семи не ходим: квота Google
# сбрасывается в полночь по тихоокеанскому, летом это 07:00 UTC, и до сброса ключи
# выжаты со вчера. Решает не крон, а due.py — почти все попытки выходят за пару секунд.
on:
  schedule:
    - cron: "25 7-23 * * *"
  workflow_dispatch:
    inputs:
      hypothesis:
        description: "main, cis или auto (по времени с прошлого прогона)"
        required: false
        default: "auto"
      queries:
        description: "сколько поисковых запросов за заход"
        required: false
        default: "14"
      max_calls:
        description: "потолок обращений к поиску; пусто = считать от своего набора ключей"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: queue-b
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VAULT_PASS: ${{ secrets.VAULT_PASS }}
    steps:
      - uses: actions/checkout@v4

      # Дешёвый выход. Большинство часовых попыток заканчиваются здесь, не потратив
      # ни установки зависимостей, ни единого обращения к поиску.
      - name: Пора ли
        id: due
        run: |
          W="${{ github.event.inputs.hypothesis }}"
          if [ -n "$W" ] && [ "$W" != "auto" ]; then
            echo "запуск руками, гипотеза: $W"
            echo "which=$W" >> "$GITHUB_OUTPUT"
          else
            python3 due.py
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.which != 'none'
        with:
          python-version: "3.12"
      - run: pip install --quiet gspread google-auth
        if: steps.due.outputs.which != 'none'

      - name: Сбор
        if: steps.due.outputs.which != 'none'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          GOOGLE_CSE_IDS: ${{ secrets.GOOGLE_CSE_IDS }}
          BS_SHEET_ID: ${{ secrets.BS_SHEET_ID }}
          # Пусто = потолок считается от СВОЕГО набора ключей и числа заходов в сутки,
          # см. people_config.KEY_SHARE и RUNS_PER_DAY. Так добавление ключей поднимает
          # потолок само, без правки этого файла.
          BS_MAX_CALLS: ${{ github.event.inputs.max_calls }}
        run: |
          W="${{ steps.due.outputs.which }}"
          N="${{ github.event.inputs.queries }}"; N="${N:-14}"
          echo "гипотеза: $W · запросов: $N"
          if [ "$W" = "cis" ]; then ./run.sh main_people_cis.py "$N"; else ./run.sh main_people.py "$N"; fi

      # Отметка времени ставится ТОЛЬКО после состоявшегося сбора. Упавший заход не
      # сдвигает счётчик, поэтому следующая попытка через час попробует снова.
      - name: Отметить прогон
        if: steps.due.outputs.which != 'none' && success()
        run: python3 stamp.py "${{ steps.due.outputs.which }}"

      - name: Сохранить состояние
        if: steps.due.outputs.which != 'none'
        run: |
          git config user.email "bot@local"; git config user.name "bot"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -q -m "state $(date -u +%FT%RZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push -q && exit 0
            sleep $((3 * i))
          done
          echo "состояние не сохранено — следующая попытка сочтёт, что прогона не было"
          exit 0
