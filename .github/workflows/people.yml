name: people

# Сбор адресов почты: основная гипотеза (Азия и Залив) и вторая (СНГ, Кавказ, Монголия).
#
# 01.10.2026, решение Дениса: сбор должен идти постоянно, а не только когда включён мак.
# Здесь работает тот же код, что и на маке (main_email_hunt.py). Курсоры и замок захода
# лежат в служебной вкладке таблицы, поэтому мак и облако не делают одну работу дважды:
# кто пришёл, тот и продолжает с места, где остановился другой.
#
# Попытка приходит каждый час круглые сутки. Новому сбору квота поиска не нужна (источники
# читаются напрямую), поэтому ночной паузы больше нет. Решает due.py: гипотезы чередуются,
# каждая не чаще раза в два часа.
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      hypothesis:
        description: "main, cis или auto (по времени с прошлого прогона)"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: queue-b
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VAULT_PASS: ${{ secrets.VAULT_PASS }}
      BS_QUIET_BEFORE_UTC: "0"
      BS_MAIN_EVERY_H: "2"
      BS_CIS_EVERY_H: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Пора ли
        id: due
        run: |
          W="${{ github.event.inputs.hypothesis }}"
          if [ -n "$W" ] && [ "$W" != "auto" ]; then
            echo "запуск руками, гипотеза: $W"
            echo "which=$W" >> "$GITHUB_OUTPUT"
          else
            python3 due.py
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.which != 'none'
        with:
          python-version: "3.12"
      - name: Зависимости
        if: steps.due.outputs.which != 'none'
        run: |
          pip install --quiet gspread google-auth
          sudo apt-get install -y -qq mupdf-tools >/dev/null

      - name: Сбор
        if: steps.due.outputs.which != 'none'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          GOOGLE_CSE_IDS: ${{ secrets.GOOGLE_CSE_IDS }}
          BS_SHEET_ID: ${{ secrets.BS_SHEET_ID }}
        run: |
          W="${{ steps.due.outputs.which }}"
          echo "гипотеза: $W"
          ./run.sh main_email_hunt.py "$W"

      - name: Отметить прогон
        if: steps.due.outputs.which != 'none' && success()
        run: python3 stamp.py "${{ steps.due.outputs.which }}"

      - name: Сохранить состояние
        if: steps.due.outputs.which != 'none'
        run: |
          git config user.email "bot@local"; git config user.name "bot"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -q -m "state $(date -u +%FT%RZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push -q && exit 0
            sleep $((3 * i))
          done
          echo "состояние не сохранено — следующая попытка сочтёт, что прогона не было"
          exit 0
