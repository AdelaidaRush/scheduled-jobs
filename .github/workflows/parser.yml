name: collect

on:
  schedule:
    - cron: "30 7,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      queries:
        description: "search budget"
        required: false
        default: "70"

permissions:
  contents: write

concurrency:
  group: queue-b
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VAULT_PASS: ${{ secrets.VAULT_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: unpack
        run: |
          ./vault.sh unlock-code work
          ./vault.sh unlock-harvest work/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: work/requirements.txt

      - name: deps
        run: pip install -r work/requirements.txt

      - name: checks
        run: ./run.sh main_checks.py

      - name: work
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          GOOGLE_CSE_IDS: ${{ secrets.GOOGLE_CSE_IDS }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          BS_SHEET_ID: ${{ secrets.BS_SHEET_ID }}
          # 7 live keys, 100 calls each, so 700 a day. One query costs two calls
          # (two pages), which is ~100 queries a run over four runs.
          MAX_GOOGLE_QUERIES: ${{ github.event.inputs.queries || '70' }}
          SEARCH_PAGES: "2"
          CRAWL_WORKERS: "12"
          DELAY_URL: "0.9"
          DELAY_PAGE: "0.7"
          DELAY_QUERY: "1.5"
        run: ./run.sh main_collect.py

      # Second source, and it spends no search quota: the crawl index hands over
      # Asian domains by the thousand and they go through the same three gates.
      # This is what keeps the base growing on days when the search vein is dry.
      - name: second source
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          BS_SHEET_ID: ${{ secrets.BS_SHEET_ID }}
          CRAWL_WORKERS: "12"
        run: ./run.sh main_crawl.py --domains 250

      # Third source: companies that passed every gate but hid their address.
      - name: dig
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          BS_SHEET_ID: ${{ secrets.BS_SHEET_ID }}
          CRAWL_WORKERS: "8"
        run: ./run.sh main_dig.py --limit 60

      - name: save
        if: always()
        run: |
          git config user.name "automation"
          git config user.email "actions@github.com"
          ./vault.sh lock-harvest work/data
          cp state.enc /tmp/fresh.enc
          cp harvest.enc /tmp/fresh-h.enc
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/fresh.enc state.enc
            cp /tmp/fresh-h.enc harvest.enc
            git add state.enc harvest.enc
            git diff --staged --quiet && echo "unchanged" && exit 0
            git commit -q -m "harvest $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q && echo "saved" && exit 0
            echo "attempt $i failed, waiting"
            sleep $((3 * i))
          done
          echo "state not saved"
          exit 0
