name: tick

on:
  schedule:
    - cron: "*/10 1-10 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run"
        required: false
        default: "false"
      force_window:
        description: "ignore the working-hours window (manual runs only)"
        required: false
        default: "false"
      smoke:
        description: "send one test letter to our own mailbox, touching nothing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: queue-a
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAULT_PASS: ${{ secrets.VAULT_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: due
        id: due
        run: |
          ./vault.sh unlock-state /tmp/st >/dev/null
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          try:
              import glob
              f = sorted(glob.glob("/tmp/st/*_state.json"))
              st = json.load(open([x for x in f if "sender" in json.load(open(x))][0]))["sender"]
              mins = (datetime.now(timezone.utc)
                      - datetime.fromisoformat(st.get("last_iso") or "")).total_seconds() / 60
          except Exception:
              mins = 10 ** 6
          print(f"minutes={mins:.0f}")
          print("go=" + ("true" if mins >= 6 else "false"))
          EOF
          echo "minutes since last: $(grep '^minutes=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

      - name: unpack
        if: steps.due.outputs.go == 'true' || github.event_name != 'schedule'
        run: ./vault.sh unlock-code work

      - uses: actions/setup-python@v5
        if: steps.due.outputs.go == 'true' || github.event_name != 'schedule'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: work/requirements.txt

      - name: deps
        if: steps.due.outputs.go == 'true' || github.event_name != 'schedule'
        run: pip install -r work/requirements.txt

      - name: checks
        if: steps.due.outputs.go == 'true' || github.event_name != 'schedule'
        run: ./run.sh main_checks.py

      - name: smoke
        if: github.event.inputs.smoke == 'true'
        env:
          BS_SENDER_USER: ${{ secrets.BS_SENDER_USER }}
          BS_SENDER_APP_PW: ${{ secrets.BS_SENDER_APP_PW }}
          BS_SALES_FIRST: ${{ secrets.BS_SALES_FIRST }}
          BS_CALENDLY_URL: ${{ secrets.BS_CALENDLY_URL }}
        run: ./run.sh main_smoke.py

      - name: work
        if: (steps.due.outputs.go == 'true' || github.event_name != 'schedule') && github.event.inputs.smoke != 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          BS_SHEET_ID: ${{ secrets.BS_SHEET_ID }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          GOOGLE_CSE_IDS: ${{ secrets.GOOGLE_CSE_IDS }}
          BS_HARVEST_HOURS: ""
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          BS_SENDER_USER: ${{ secrets.BS_SENDER_USER }}
          BS_SALES_USER: ${{ secrets.BS_SENDER_USER }}
          BS_SENDER_APP_PW: ${{ secrets.BS_SENDER_APP_PW }}
          BS_SALES_FIRST: ${{ secrets.BS_SALES_FIRST }}
          BS_CALENDLY_URL: ${{ secrets.BS_CALENDLY_URL }}
          BS_CALENDLY_TOKEN: ${{ secrets.BS_CALENDLY_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          BS_DAILY_CAP: "55"
          BS_WORK_FROM: ${{ github.event.inputs.force_window == 'true' && '0' || '9' }}
          BS_WORK_TO: ${{ github.event.inputs.force_window == 'true' && '23' || '18' }}
          BS_WEEKDAYS_ONLY: ${{ github.event.inputs.force_window == 'true' && 'false' || 'true' }}
        run: ./run.sh main_tick.py

      - name: save
        if: always() && (steps.due.outputs.go == 'true' || github.event_name != 'schedule')
        run: |
          git config user.name "automation"
          git config user.email "actions@github.com"
          cp state.enc /tmp/fresh.enc
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/fresh.enc state.enc
            git add state.enc
            git diff --staged --quiet && echo "unchanged" && exit 0
            git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q && echo "saved" && exit 0
            echo "attempt $i failed, waiting"
            sleep $((3 * i))
          done
          echo "state not saved"
          exit 0
